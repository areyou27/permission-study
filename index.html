<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>StudySpot</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="phone" id="phone">

  <!-- Shown instead of the app when it cannot run (research mode before setup is finished) -->
  <section class="screen" id="s-notready">
    <div class="splash">
      <h1>This page is not ready yet</h1>
      <p class="lead">Please tell the person who gave you this link.</p>
    </div>
    <div id="notready-detail"></div>
  </section>

  <!-- 1. Welcome (both versions) -->
  <section class="screen app" id="s-welcome">
    <div id="preview-notes"></div>
    <div class="splash">
      <div class="logo big" aria-hidden="true"></div>
      <h1 class="app-name" data-app></h1>
      <p class="lead" id="welcome-text"></p>
    </div>
    <div class="spacer"></div>
    <div class="action">
      <button class="btn primary" id="btn-start"></button>
    </div>
  </section>

  <!-- 2 to 4. One screen per permission. Version A and Version B differ only in #pre-reason. -->
  <section class="screen app" id="s-pre">
    <header class="appbar">
      <div class="logo small" aria-hidden="true"></div>
      <div class="appbar-title" data-app></div>
    </header>
    <p class="reason" id="pre-reason"></p>
    <div class="spacer"></div>
    <div class="action">
      <button class="btn primary" id="btn-pre-continue"></button>
      <div class="waiting" id="pre-waiting" role="status" aria-label="Waiting" hidden>
        <div class="dots"><span></span><span></span><span></span></div>
      </div>
    </div>
  </section>

  <!-- 5. Continue (both versions) -->
  <section class="screen app" id="s-thanks">
    <div class="splash">
      <div class="logo big" aria-hidden="true"></div>
      <h1 class="app-name" data-app></h1>
      <p class="lead" id="thanks-text"></p>
    </div>
    <div id="preview-form" hidden></div>
    <div class="spacer"></div>
    <div class="action">
      <button class="btn primary" id="btn-continue"></button>
    </div>
  </section>

  <!-- Simulated dialog. Preview mode with ?sim=1 only; never used with participants. -->
  <div class="dim" id="dim" hidden>
    <div class="os-dialog" id="os-dialog" role="dialog" aria-modal="true"></div>
  </div>

</div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
